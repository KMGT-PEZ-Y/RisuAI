<div class="bsim-panel">
  <header class="bsim-header">
    <div>
      <span class="bsim-kicker">
        LIVE MATCH
      </span>
      <h3>
        Round 1 · Turn 0
      </h3>
    </div>
    <span class="bsim-status">
      TOTAL 0
    </span>
  </header>
  <div class="bsim-grid">
    <section class="bsim-unit bsim-unit-player">
      <div class="bsim-unit-head">
        <b>
          Player
        </b>
        <small>
          다운 0 / 3
        </small>
      </div>
      <div class="bsim-portrait-frame">
        <span class="bsim-portrait-fallback">
          P
        </span>
        <div class="bsim-heartbeat-layer">
          <div class="bsim-hit-layer">
            <img class="bsim-portrait" src="{{raw::player_main_d0_healthy.png}}" alt="Player" loading="eager" decoding="sync">
          </div>
        </div>
        <div class="bsim-damage-flash">
        </div>
        <div class="bsim-conditions">
        </div>
      </div>
      <div class="bsim-resources">
        <div class="bsim-meter">
          <div class="bsim-meter-label">
            <span>
              HP
            </span>
            <span>
              100 / 100
            </span>
          </div>
          <div class="bsim-meter-track">
            <i class="bsim-meter-fill bsim-meter-hp" style="width:100%">
            </i>
          </div>
        </div>
        <div class="bsim-meter">
          <div class="bsim-meter-label">
            <span>
              STA
            </span>
            <span>
              100 / 100
            </span>
          </div>
          <div class="bsim-meter-track">
            <i class="bsim-meter-fill bsim-meter-sta" style="width:100%">
            </i>
          </div>
        </div>
        <div class="bsim-meter">
          <div class="bsim-meter-label">
            <span>
              BRK
            </span>
            <span>
              0 / 100
            </span>
          </div>
          <div class="bsim-meter-track">
            <i class="bsim-meter-fill bsim-meter-brk" style="width:0%">
            </i>
          </div>
        </div>
      </div>
    </section>
    <section class="bsim-unit bsim-unit-enemy">
      <div class="bsim-unit-head">
        <b>
          균형 잡힌 병사
        </b>
        <small>
          다운 0 / 3
        </small>
      </div>
      <div class="bsim-portrait-frame">
        <span class="bsim-portrait-fallback">
          E
        </span>
        <div class="bsim-heartbeat-layer">
          <div class="bsim-hit-layer">
            <img class="bsim-portrait" src="{{raw::balanced_soldier_main_d0_healthy.png}}" alt="균형 잡힌 병사" loading="eager" decoding="sync">
          </div>
        </div>
        <div class="bsim-damage-flash">
        </div>
        <div class="bsim-conditions">
        </div>
      </div>
      <div class="bsim-resources">
        <div class="bsim-meter">
          <div class="bsim-meter-label">
            <span>
              HP
            </span>
            <span>
              100 / 100
            </span>
          </div>
          <div class="bsim-meter-track">
            <i class="bsim-meter-fill bsim-meter-hp" style="width:100%">
            </i>
          </div>
        </div>
        <div class="bsim-meter">
          <div class="bsim-meter-label">
            <span>
              STA
            </span>
            <span>
              100 / 100
            </span>
          </div>
          <div class="bsim-meter-track">
            <i class="bsim-meter-fill bsim-meter-sta" style="width:100%">
            </i>
          </div>
        </div>
        <div class="bsim-meter">
          <div class="bsim-meter-label">
            <span>
              BRK
            </span>
            <span>
              0 / 100
            </span>
          </div>
          <div class="bsim-meter-track">
            <i class="bsim-meter-fill bsim-meter-brk" style="width:0%">
            </i>
          </div>
        </div>
      </div>
    </section>
  </div>
  <div class="bsim-grid">
    <div class="bsim-live-deck">
      <b>
        내 장착 스킬
      </b>
      <div class="bsim-chip-list">
        <span>
          없음
        </span>
      </div>
    </div>
    <div class="bsim-live-deck">
      <b>
        상대 장착 스킬
      </b>
      <div class="bsim-chip-list">
        <span>
          없음
        </span>
      </div>
    </div>
  </div>
  <div class="bsim-actions">
    <button class="bsim-chip is-selected" risu-btn="bs;act;713-0~0~0;attack">
      공격
    </button>
    <button class="bsim-chip" risu-btn="bs;act;713-0~0~0;defend">
      방어
    </button>
    <button class="bsim-chip" risu-btn="bs;act;713-0~0~0;evade">
      회피
    </button>
  </div>
  <div class="bsim-skill-selection">
    <h4>
      이번 턴 스킬
    </h4>
    <div class="bsim-chip-list">
      <button class="bsim-chip is-selected" risu-btn="bs;skill;713-0~0~0;none">
        기본 행동만
      </button>
    </div>
    <div class="bsim-skill-detail">
      스킬을 선택하면 이곳에 설명이 표시됩니다. 기본 행동만 실행할 수도 있습니다.
    </div>
    <button class="bsim-chip is-selected" risu-btn="bs;execute;713-0~0~0">
      선택한 행동 실행
    </button>
  </div>
  <div class="bsim-log">
    <div class="bsim-log-title">
      COMBAT LOG
    </div>
  </div>
  <div class="bsim-chip-list">
    <button class="bsim-chip" risu-btn="bs;livefast">
      빠른 진행: 꺼짐
    </button>
    <button class="bsim-chip" risu-btn="bs;setup">
      대전 설정
    </button>
  </div>
  <div class="bsim-asset-preload" aria-hidden="true">
    <img src="{{raw::player_action_attack.png}}" alt="" loading="eager">
    <img src="{{raw::player_action_defend.png}}" alt="" loading="eager">
    <img src="{{raw::player_action_evade.png}}" alt="" loading="eager">
    <img src="{{raw::balanced_soldier_action_attack.png}}" alt="" loading="eager">
    <img src="{{raw::balanced_soldier_action_defend.png}}" alt="" loading="eager">
    <img src="{{raw::balanced_soldier_action_evade.png}}" alt="" loading="eager">
  </div>
</div>
